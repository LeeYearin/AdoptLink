<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Account</title>
    <link rel="stylesheet" href="../css/account.css" />
    <link rel="stylesheet" href="../css/account_signup.css" />
  </head>
  <body>
    <div id="left" class="container">
      <div id="content1">
        <img src="../media//account/chain-icon.png" alt="chain-icon" />
        <p>유기동물 인식 개선 프로젝트</p>
      </div>
      <div id="content2">
        <img src="../media/account/love-icon.png" alt="love-icon" />
        <h2>"손을 내밀어 그들의 우주가 되어주세요"</h2>
        <p>
          상처받은 아이들의 눈망울에서 피어날 새로운 행복을 AdoptLink가 함께
          이어갑니다.
        </p>
      </div>
      <div id="content3">
        <p>#사지말고입양하세요</p>
      </div>
    </div>
    <div id="right" class="container">
      <div id="center-box">
        <div id="title">
          <div>WELCOME TO ADOPTLINK</div>
          <h1>반갑습니다!</h1>
          <p>
            입양 대기 중인 아이들에게 따뜻한 내일을 선물하기 위한 여정을
            시작하세요.
          </p>
        </div>
        <div id="bar">
          <a href="account_signin.html">
            <img
              src="../media/account/brown-signin-icon.png"
              alt="white-signin-icon"
            />
            로그인
          </a>
          <a href="account_signup.html">
            <img
              src="../media/account/white-signup-icon.png"
              alt="brown-signup-icon"
            />
            회원가입
          </a>
        </div>
        <form method="method" action="">
          <div class="abreast-box">
            <p>이름</p>
            <div class="input-box">
              <img src="../media/account/user-icon.png" alt="user-icon" />
              <input type="text" placeholder="본명" />
            </div>
          </div>
          <div class="abreast-box">
            <p>연락처</p>
            <div class="input-box">
              <img src="../media/account/phone-icon.png" alt="phone-icon" />
              <input type="text" placeholder="010-1234-5678" />
            </div>
          </div>
          <p>이메일 주소</p>
          <div class="input-box">
            <img src="../media/account/email-icon.png" alt="email-icon" />
            <input type="email" placeholder="adopt@example.com" />
          </div>
          <div class="abreast-box">
            <p>비밀번호 입력</p>
            <div class="input-box">
              <img src="../media/account/pw-icon.png" alt="pw-icon" />
              <input type="password" id="password" placeholder="8자 이상" />
            </div>
          </div>
          <div class="abreast-box">
            <p>비밀번호 확인</p>
            <div class="input-box">
              <img src="../media/account/check-icon.png" alt="check-icon" />
              <input
                type="password"
                id="password"
                placeholder="비밀번호 재입력"
              />
            </div>
          </div>
          <input type="submit" value="AdoptLink 로그인" />
        </form>
      </div>
    </div>
  </body>
</html>
